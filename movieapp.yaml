apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-movies

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react-movies

  template:
    metadata:
      labels:
        app: react-movies

    spec:
      containers:
      - name: react-movies

        image: sharathmuddam/react-movies:latest

        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service

metadata:
  name: react-movies-service

spec:
  type: LoadBalancer

  selector:
    app: react-movies

  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
